{% extends "base.html" %}{% block cuerpo %}
<div class="card"><h1>Usuarios</h1><p><a class="btn" href="{{ url_for('usuario_form') }}">Nuevo usuario</a></p>
<table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th><th></th></tr>
{% for u in lista %}<tr><td>{{ u.nombre }}</td><td>{{ u.correo }}</td><td>{{ u.rol }}</td><td>{{ 'Sí' if u.activo else 'No' }}</td>
<td><a href="{{ url_for('usuario_form', uid=u.id) }}">Editar</a></td></tr>{% endfor %}</table></div>
{% endblock %}
