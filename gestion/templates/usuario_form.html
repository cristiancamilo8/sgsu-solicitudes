{% extends "base.html" %}{% block cuerpo %}
<div class="card" style="max-width:520px"><h1>{{ 'Editar' if u else 'Nuevo' }} usuario</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}">
<label>Nombre</label><input name="nombre" required value="{{ u.nombre if u else request.form.nombre }}">
<label>Correo</label><input name="correo" type="email" required value="{{ u.correo if u else request.form.correo }}">
<label>Rol</label><select name="rol">{% for r in ROLES %}<option {{ 'selected' if u and u.rol==r }}>{{ r }}</option>{% endfor %}</select>
<label>Contraseña {% if u %}<small>(déjala vacía para no cambiarla)</small>{% endif %}</label>
<input name="password" type="password" {{ '' if u else 'required' }} minlength="8">
{% if u %}<label><input type="checkbox" name="activo" value="1" {{ 'checked' if u.activo }}> Usuario activo</label>{% endif %}
<p><button>Guardar</button> <a class="btn sec" href="{{ url_for('usuarios') }}">Cancelar</a></p></form></div>
{% endblock %}
